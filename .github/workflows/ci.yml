name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install
        run: pip install -r requirements.txt pytest

      - name: Unit tests
        run: python -m pytest -q

      - name: Eval gate (regex + rules, known failures excluded)
        run: python scripts/evaluate_scan.py --no-gitleaks --fail-on-mismatch --output ../eval-report.md

      - name: Blind holdout reports (not gating; see docs/EVAL_BLIND.md)
        run: |
          python scripts/evaluate_scan.py --no-gitleaks --dataset eval/blind_dev.jsonl --output ../blind-dev-report.md
          python scripts/evaluate_scan.py --no-gitleaks --dataset eval/blind_test.jsonl --output ../blind-test-report.md

      - name: Upload eval reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: eval-reports
          path: |
            eval-report.md
            blind-dev-report.md
            blind-test-report.md

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm test
      - run: npm run build
